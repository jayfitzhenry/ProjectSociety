<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Project Society: download your old save</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <div class="page signin">
      <section class="card signin-card">
        <h1>💾 Your old save</h1>
        <p class="lead">Before sign-in, Project Society kept characters and the crew in this browser only.
          This page downloads that data as a file, so you can import it into your account.</p>
        <div id="legacy-out"><p class="muted">Looking…</p></div>
        <p class="muted small">Then sign in to the new app and choose <b>Import a backup file</b>.</p>
      </section>
    </div>
  </main>
  <script type="module" src="js/legacy-export.js"></script>
</body>
</html>
